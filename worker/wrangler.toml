name = "santinos-checkout"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Ajuste depois do primeiro deploy / conforme o domínio final.
[vars]
SITE_URL = "https://www.santinos.com.br"
ALLOWED_ORIGIN = "https://www.santinos.com.br"
# NOTIFY_EMAIL = "contato@santinos.com.br"

# Domínio *.vercel.app do projeto (não o customizado santinos.com.br!) usado
# só pra chamar o proxy de frete. Ver comentário em cotarMelhorEnvio() no
# index.js pra entender por quê. Confira em Vercel -> projeto -> Deployments
# -> Production Deployment -> Domains se esse endereço mudar algum dia.
FRETE_PROXY_URL = "https://santinos-sage.vercel.app"

# Banco D1 (pedidos + cupons — ver schema.sql). Criar com:
#   npx wrangler d1 create santinos-db
# e colar o "database_id" que o comando devolver aqui embaixo.
[[d1_databases]]
binding = "DB"
database_name = "santinos-db"
database_id = "20fefdbd-c5ac-46a7-889d-16a5bce7bd6b"

# Secrets (NÃO vão aqui): configurar com
#   npx wrangler secret put MP_ACCESS_TOKEN
#   npx wrangler secret put INTERNAL_SHARED_SECRET
#   npx wrangler secret put ADMIN_PASSWORD
#
# INTERNAL_SHARED_SECRET precisa ser IGUAL ao valor configurado na Vercel
# (variável INTERNAL_SHARED_SECRET do projeto, usada por api/melhor-envio.js).
# O MELHOR_ENVIO_TOKEN e o ORIGEM_CEP não ficam mais aqui — foram pra Vercel,
# veja api/melhor-envio.js.
# ADMIN_PASSWORD é a senha do painel /admin.html (usuário fixo "admin").
