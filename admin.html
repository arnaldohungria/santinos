<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Santino's</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<style>
  /* Estilos só do painel — não precisa ficar em style.css, é uso interno. */
  .admin-wrap{ max-width: 1040px; margin: 0 auto; padding: 40px 20px 80px; }
  .admin-login{ max-width: 340px; margin: 120px auto; text-align: center; }
  .admin-login input{
    display:block; width:100%; margin: 16px 0; background: var(--charcoal-2);
    color: var(--bone); border: 1px solid var(--bone-faint); border-radius: 3px;
    padding: 11px 12px; font-family: var(--body); font-size: 15px;
  }
  .admin-login input:focus{ outline:none; border-color: var(--ember); }
  .admin-erro{ color: var(--reaper); font-size: 13px; min-height: 1.2em; margin-top: 8px; }
  .admin-top{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom: 28px; }
  .admin-tabs{ display:flex; gap: 8px; margin-bottom: 24px; }
  .admin-tab{
    background: none; border: 1px solid var(--bone-faint); color: var(--bone-dim);
    padding: 9px 18px; border-radius: 3px; font-family: var(--body); font-weight: 600;
    font-size: 13px; cursor: pointer;
  }
  .admin-tab.ativo{ border-color: var(--ember); color: var(--ember); }
  .admin-secao{ display:none; }
  .admin-secao.ativa{ display:block; }
  #pedidosBox, #cuponsBox{ overflow-x: auto; }
  .admin-tabela{ width:100%; min-width: 640px; border-collapse: collapse; font-size: 13px; }
  .admin-tabela th, .admin-tabela td{
    text-align:left; padding: 10px 12px; border-bottom: 1px solid var(--bone-faint);
    vertical-align: top;
  }
  .admin-tabela th{ color: var(--bone-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .status-pill{
    display:inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .status-approved{ background: rgba(232,99,43,0.18); color: var(--ember); }
  .status-pending, .status-in_process{ background: rgba(241,230,211,0.14); color: var(--bone-dim); }
  .status-rejected, .status-cancelled{ background: rgba(194,42,42,0.18); color: var(--reaper); }
  .admin-vazio{ color: var(--bone-dim); font-size: 13px; padding: 24px 0; }
  .cupom-form{
    display:flex; gap: 10px; align-items:flex-end; flex-wrap: wrap;
    background: var(--charcoal-2); border: 1px solid var(--bone-faint); border-radius: 6px;
    padding: 18px; margin-bottom: 22px;
  }
  .cupom-form label{ font-size: 11px; color: var(--bone-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .cupom-form input, .cupom-form select{
    display:block; margin-top: 5px; background: var(--charcoal); color: var(--bone);
    border: 1px solid var(--bone-faint); border-radius: 3px; padding: 9px 10px; font-size: 14px;
  }
  .cupom-form .btn{ padding: 10px 20px; font-size: 13px; }
  .acao-link{ background:none; border:none; color: var(--bone-dim); font-size: 12px; cursor:pointer; text-decoration: underline; padding: 0; margin-right: 12px; }
  .acao-link:hover{ color: var(--ember); }
  .admin-msg{ font-size: 13px; margin: 10px 0; min-height: 1.2em; }
  .admin-msg.ok{ color: var(--ember); }
  .admin-msg.erro{ color: var(--reaper); }
</style>
</head>
<body>

<div class="admin-wrap">

  <div id="adminLogin" class="admin-login">
    <p class="wordmark" style="margin-bottom:8px;">Santino's</p>
    <p style="color:var(--bone-dim); font-size:13px;">Painel de administração</p>
    <input type="password" id="adminSenha" placeholder="Senha" autocomplete="current-password">
    <button type="button" class="btn btn-primary" id="adminEntrar" style="width:100%;">Entrar</button>
    <p class="admin-erro" id="adminErro"></p>
  </div>

  <div id="adminPainel" hidden>
    <div class="admin-top">
      <p class="wordmark" style="margin:0;">Santino's — Admin</p>
      <button type="button" class="acao-link" id="adminSair">Sair</button>
    </div>

    <div class="admin-tabs">
      <button type="button" class="admin-tab ativo" data-tab="pedidos">Pedidos</button>
      <button type="button" class="admin-tab" data-tab="cupons">Cupons</button>
    </div>

    <section class="admin-secao ativa" id="secaoPedidos">
      <div id="pedidosBox"><p class="admin-vazio">Carregando…</p></div>
    </section>

    <section class="admin-secao" id="secaoCupons">
      <div class="cupom-form">
        <div>
          <label for="cfCodigo">Código</label>
          <input type="text" id="cfCodigo" placeholder="LANCA10" style="text-transform:uppercase;">
        </div>
        <div>
          <label for="cfTipo">Tipo</label>
          <select id="cfTipo">
            <option value="percentual">% percentual</option>
            <option value="fixo">R$ fixo</option>
          </select>
        </div>
        <div>
          <label for="cfValor">Valor</label>
          <input type="number" id="cfValor" min="1" placeholder="10" style="width:100px;">
        </div>
        <button type="button" class="btn btn-primary" id="cfSalvar">Salvar cupom</button>
      </div>
      <p class="admin-msg" id="cupomFormMsg"></p>
      <div id="cuponsBox"><p class="admin-vazio">Carregando…</p></div>
    </section>
  </div>

</div>

<script>
/* Painel de admin — separado do loja.js de propósito (não precisa do
 * carrinho/drawer/etc, só fala com o Worker via Basic Auth). URL do Worker
 * é uma cópia da mesma usada em loja.js (LOJA_CONFIG.workerUrl); se mudar
 * lá, mudar aqui também. */
const WORKER_URL = "https://santinos-checkout.santinos.workers.dev";
const AUTH_KEY = "santinos_admin_auth";

function fmtCentavos(c) {
  return ((c || 0) / 100).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function fmtData(iso) {
  if (!iso) return "—";
  try { return new Date(iso).toLocaleString("pt-BR"); } catch { return iso; }
}

function authHeader() {
  const v = sessionStorage.getItem(AUTH_KEY);
  return v ? { Authorization: "Basic " + v } : {};
}

async function chamarAdmin(caminho, opcoes = {}) {
  const r = await fetch(WORKER_URL.replace(/\/$/, "") + caminho, {
    ...opcoes,
    headers: { ...authHeader(), ...(opcoes.headers || {}) },
  });
  if (r.status === 401) {
    sessionStorage.removeItem(AUTH_KEY);
    mostrarLogin("Sessão expirada. Entre de novo.");
    throw new Error("não autorizado");
  }
  return r;
}

function mostrarLogin(erro) {
  document.getElementById("adminPainel").hidden = true;
  document.getElementById("adminLogin").hidden = false;
  document.getElementById("adminErro").textContent = erro || "";
}

async function tentarEntrar() {
  const senha = document.getElementById("adminSenha").value;
  const erroEl = document.getElementById("adminErro");
  if (!senha) return;
  const b64 = btoa("admin:" + senha);
  try {
    const r = await fetch(WORKER_URL.replace(/\/$/, "") + "/admin/pedidos", {
      headers: { Authorization: "Basic " + b64 },
    });
    if (!r.ok) {
      erroEl.textContent = "Senha incorreta.";
      return;
    }
    sessionStorage.setItem(AUTH_KEY, b64);
    document.getElementById("adminLogin").hidden = true;
    document.getElementById("adminPainel").hidden = false;
    carregarPedidos();
    carregarCupons();
  } catch {
    erroEl.textContent = "Não consegui falar com o servidor. Tente de novo.";
  }
}

document.getElementById("adminEntrar").addEventListener("click", tentarEntrar);
document.getElementById("adminSenha").addEventListener("keydown", (e) => {
  if (e.key === "Enter") tentarEntrar();
});
document.getElementById("adminSair").addEventListener("click", () => {
  sessionStorage.removeItem(AUTH_KEY);
  mostrarLogin();
});

document.querySelectorAll(".admin-tab").forEach((tab) => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".admin-tab").forEach((t) => t.classList.remove("ativo"));
    document.querySelectorAll(".admin-secao").forEach((s) => s.classList.remove("ativa"));
    tab.classList.add("ativo");
    document.getElementById("secao" + tab.dataset.tab[0].toUpperCase() + tab.dataset.tab.slice(1)).classList.add("ativa");
  });
});

const STATUS_NOME = {
  approved: "Aprovado", pending: "Pendente", in_process: "Em análise",
  rejected: "Recusado", cancelled: "Cancelado",
};

async function carregarPedidos() {
  const box = document.getElementById("pedidosBox");
  try {
    const r = await chamarAdmin("/admin/pedidos");
    const d = await r.json();
    const pedidos = d.pedidos || [];
    if (!pedidos.length) {
      box.innerHTML = '<p class="admin-vazio">Nenhum pedido ainda.</p>';
      return;
    }
    box.innerHTML = `<table class="admin-tabela">
      <thead><tr>
        <th>Data</th><th>Cliente</th><th>Itens</th><th>Total</th><th>Cupom</th><th>Status</th>
      </tr></thead>
      <tbody>${pedidos.map(linhaPedido).join("")}</tbody>
    </table>`;
  } catch {
    box.innerHTML = '<p class="admin-vazio">Não consegui carregar os pedidos.</p>';
  }
}

function linhaPedido(p) {
  const itens = (p.itens || []).map((i) => `${i.qtd}× ${i.id}`).join(", ") || "—";
  const status = (p.status || "").toLowerCase();
  const contato = [p.email, p.whatsapp].filter(Boolean).join(" · ");
  return `<tr>
    <td>${fmtData(p.criado_em)}</td>
    <td>${p.nome || "—"}${contato ? `<br><span style="color:var(--bone-dim);font-size:11px;">${contato}</span>` : ""}</td>
    <td>${itens}</td>
    <td>${fmtCentavos(p.total_centavos)}</td>
    <td>${p.cupom || "—"}</td>
    <td><span class="status-pill status-${status}">${STATUS_NOME[status] || p.status || "—"}</span></td>
  </tr>`;
}

async function carregarCupons() {
  const box = document.getElementById("cuponsBox");
  try {
    const r = await chamarAdmin("/admin/cupons");
    const d = await r.json();
    const cupons = d.cupons || [];
    if (!cupons.length) {
      box.innerHTML = '<p class="admin-vazio">Nenhum cupom cadastrado ainda.</p>';
      return;
    }
    box.innerHTML = `<table class="admin-tabela">
      <thead><tr><th>Código</th><th>Desconto</th><th>Status</th><th></th></tr></thead>
      <tbody>${cupons.map(linhaCupom).join("")}</tbody>
    </table>`;
    box.querySelectorAll("[data-toggle]").forEach((btn) => {
      btn.addEventListener("click", () => alternarCupom(btn.dataset.toggle, btn.dataset.tipo, Number(btn.dataset.valor), btn.dataset.ativo === "1"));
    });
    box.querySelectorAll("[data-apagar]").forEach((btn) => {
      btn.addEventListener("click", () => apagarCupom(btn.dataset.apagar));
    });
  } catch {
    box.innerHTML = '<p class="admin-vazio">Não consegui carregar os cupons.</p>';
  }
}

function linhaCupom(c) {
  const desconto = c.tipo === "percentual" ? `${c.valor}%` : fmtCentavos(c.valor);
  const ativo = c.ativo === 1 || c.ativo === true;
  return `<tr>
    <td><strong>${c.codigo}</strong></td>
    <td>${desconto}</td>
    <td><span class="status-pill ${ativo ? "status-approved" : "status-pending"}">${ativo ? "Ativo" : "Desativado"}</span></td>
    <td>
      <button type="button" class="acao-link" data-toggle="${c.codigo}" data-tipo="${c.tipo}" data-valor="${c.valor}" data-ativo="${ativo ? 1 : 0}">${ativo ? "Desativar" : "Ativar"}</button>
      <button type="button" class="acao-link" data-apagar="${c.codigo}">Apagar</button>
    </td>
  </tr>`;
}

async function alternarCupom(codigo, tipo, valor, ativoAtual) {
  await chamarAdmin("/admin/cupons", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ codigo, tipo, valor, ativo: !ativoAtual }),
  });
  carregarCupons();
}

async function apagarCupom(codigo) {
  if (!confirm(`Apagar o cupom ${codigo}? Essa ação não pode ser desfeita.`)) return;
  await chamarAdmin("/admin/cupons?codigo=" + encodeURIComponent(codigo), { method: "DELETE" });
  carregarCupons();
}

document.getElementById("cfSalvar").addEventListener("click", async () => {
  const msg = document.getElementById("cupomFormMsg");
  const codigo = document.getElementById("cfCodigo").value.trim().toUpperCase();
  const tipo = document.getElementById("cfTipo").value;
  const valor = Number(document.getElementById("cfValor").value);
  if (!codigo || !valor || valor <= 0) {
    msg.className = "admin-msg erro";
    msg.textContent = "Preencha código e valor (maior que zero).";
    return;
  }
  try {
    const r = await chamarAdmin("/admin/cupons", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ codigo, tipo, valor }),
    });
    if (!r.ok) throw new Error();
    msg.className = "admin-msg ok";
    msg.textContent = `Cupom ${codigo} salvo!`;
    document.getElementById("cfCodigo").value = "";
    document.getElementById("cfValor").value = "";
    carregarCupons();
  } catch {
    msg.className = "admin-msg erro";
    msg.textContent = "Não consegui salvar o cupom.";
  }
});

// Sessão já aberta nesta aba (sessionStorage)? Pula direto pro painel.
if (sessionStorage.getItem(AUTH_KEY)) {
  document.getElementById("adminLogin").hidden = true;
  document.getElementById("adminPainel").hidden = false;
  carregarPedidos();
  carregarCupons();
}
</script>

</body>
</html>
