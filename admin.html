<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Santino's</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin/admin.css">
</head>
<body>

<!-- Login -->
<div id="login" class="login" hidden>
  <div class="login-caixa">
    <div class="marca">Santino's</div>
    <p class="login-sub">Painel de administração</p>
    <input type="password" id="loginSenha" placeholder="Senha" autocomplete="current-password" aria-label="Senha">
    <button type="button" class="btn btn-prim" id="loginEntrar">Entrar</button>
    <p class="login-erro" id="loginErro" role="alert"></p>
  </div>
</div>

<!-- Painel -->
<div id="app" class="app" hidden>
  <aside class="side" id="side">
    <div class="side-marca"><div class="marca">Santino's</div><span>PAINEL</span></div>
    <nav class="nav" id="nav" aria-label="Seções"></nav>
    <div class="side-rodape">
      <a href="index.html" target="_blank" rel="noopener">Ver a loja ↗</a>
      <button type="button" id="btnSair">Sair</button>
    </div>
  </aside>
  <div class="nav-fundo" id="navFundo"></div>

  <div class="main">
    <header class="top">
      <button type="button" class="icone-btn menu-btn" id="btnMenu" aria-label="Abrir menu">☰</button>
      <h1 id="titulo">Dashboard</h1>
      <div class="top-acoes">
        <span id="carimbo"></span>
        <button type="button" class="icone-btn" id="btnAtualizar" title="Atualizar dados" aria-label="Atualizar dados">↻</button>
      </div>
    </header>
    <div class="filtros" id="barraPeriodo" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>

<!-- Gaveta lateral (detalhes de pedido/cliente) -->
<div id="drawer" class="drawer" hidden>
  <div class="drawer-fundo" data-fechar></div>
  <aside class="drawer-painel" role="dialog" aria-modal="true" aria-labelledby="drawerTitulo">
    <header class="drawer-cab">
      <div><h2 id="drawerTitulo"></h2><div class="drawer-sub" id="drawerSub"></div></div>
      <button type="button" class="icone-btn drawer-fechar" data-fechar aria-label="Fechar">✕</button>
    </header>
    <div class="drawer-corpo" id="drawerCorpo"></div>
  </aside>
</div>

<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="printArea"></div>

<script type="module" src="admin/app.js"></script>
</body>
</html>
